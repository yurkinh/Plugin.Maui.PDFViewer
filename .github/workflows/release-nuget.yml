name: Create a (Pre)release on NuGet

# Runs for tags like v1.0.0, v1.0.0-preview1 or v0.1.0-preview.1 (the version style in Directory.Build.props). The
# tagged commit must be on main. It publishes one package, Plugin.Maui.PDFViewer, with the Melville.Pdf assemblies
# bundled (see pack-nuget.sh), and its symbols package.
#
# Publishing uses NuGet trusted publishing (OIDC), no long-lived API key: nuget.org has a trusted publishing policy for
# this repository and this workflow file (release-nuget.yml), and NuGet/login exchanges the job's GitHub token for a
# short-lived nuget.org key. The job runs in the GitHub environment 'release', which holds the secret NUGET_USER (the
# nuget.org profile name, not the email) and can require an approval before anything is published.

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-preview[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+"

jobs:
  release-nuget:
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write   # NuGet/login: the OIDC token for trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Verify commit exists in origin/main
        shell: bash
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/main

      - name: Get version information from tag
        id: get_version
        run: |
          $version="${{github.ref_name}}".TrimStart("v")
          "version-without-v=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Melville.StreamInterfaces into the fork's local feed
        shell: bash
        run: ./external/Pdf/build-local-packages.sh

      # What CI checks on every push, again on the tagged commit before anything is published.
      - name: Test
        run: dotnet test --project tests\Plugin.Maui.PDFViewer.Tests\Plugin.Maui.PDFViewer.Tests.csproj -c Release

      - name: Pack
        shell: bash
        run: PLUGIN_VERSION=${{ steps.get_version.outputs.version-without-v }} ./pack-nuget.sh

      # Right before the push: the nuget.org key it returns lasts an hour.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        shell: bash
        run: |
          # Only the plugin: artifacts/nuget can also hold the fork's local Melville.Streams packages, which are not ours
          # to publish. The .snupkg next to it is pushed with it.
          dotnet nuget push artifacts/nuget/Plugin.Maui.PDFViewer.*.nupkg -s https://api.nuget.org/v3/index.json \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
