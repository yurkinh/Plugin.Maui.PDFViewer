name: Create a (Pre)release on NuGet

# Runs for tags like v1.0.0 or v1.0.0-preview1 (as in the Plugin.Maui.Feature template), but only when the
# repository variable PUBLISH_NUGET is 'true'; it also needs the secret NUGET_API_KEY.
#
# Not usable yet: Plugin.Maui.PDFViewer depends on this fork's builds of the Melville.Pdf libraries, and the
# Melville.* package IDs on nuget.org belong to the upstream author. Before a release, upstream must publish packages
# with net10.0 assets, or the libraries need their own IDs, or they must be bundled into this package.

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-preview[0-9]+"

jobs:
  release-nuget:
    if: vars.PUBLISH_NUGET == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Verify commit exists in origin/main
        shell: bash
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/main

      - name: Get version information from tag
        id: get_version
        run: |
          $version="${{github.ref_name}}".TrimStart("v")
          "version-without-v=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Pack
        shell: bash
        run: PLUGIN_VERSION=${{ steps.get_version.outputs.version-without-v }} ./pack-nuget.sh

      - name: Push
        shell: bash
        run: |
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" -s https://api.nuget.org/v3/index.json -k "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
          done
