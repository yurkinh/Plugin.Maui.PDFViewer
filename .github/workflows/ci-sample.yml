name: Build Sample App for CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-sample-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]   # Windows heads on Windows; iOS and Mac Catalyst heads on macOS
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    # .NET 11's iOS and Mac Catalyst packs need the newest Xcode (27.2 for 11.0.0); use the newest on the runner.
    - name: Select the newest Xcode
      if: runner.os == 'macOS'
      run: |
        latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
        sudo xcode-select -s "$latest"
        xcodebuild -version

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui

    - name: Build Melville.StreamInterfaces into the fork's local feed
      shell: bash
      run: ./external/Pdf/build-local-packages.sh

    - name: Build
      run: dotnet build samples/Plugin.Maui.PDFViewer.Sample.slnx -c Release
