name: Build Sample App for CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-sample-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]   # Windows heads on Windows; iOS and Mac Catalyst heads on macOS
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    # .NET 11's iOS and Mac Catalyst packs need Xcode 27.2 (MAUI 11.0.0). Use the newest Xcode on the runner, and skip
    # the Apple builds (with a warning, not a false success) while the runner image has no Xcode 27.2.
    - name: Select the newest Xcode
      id: xcode
      if: runner.os == 'macOS'
      shell: bash
      run: |
        latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
        sudo xcode-select -s "$latest"
        version=$(xcodebuild -version | awk 'NR==1 {print $2}')
        echo "Xcode $version"
        if [ "$(printf '%s\n' 27.2 "$version" | sort -V | head -1)" = "27.2" ]; then
          echo "apple=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::The runner has Xcode $version; MAUI 11.0.0 needs Xcode 27.2. iOS and Mac Catalyst builds are skipped."
          echo "apple=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui

    - name: Build Melville.StreamInterfaces into the fork's local feed
      shell: bash
      run: ./external/Pdf/build-local-packages.sh

    # On macOS the samples' iOS and Mac Catalyst heads need Xcode 27.2; Windows builds the Android and Windows heads.
    - name: Build
      if: runner.os == 'Windows' || steps.xcode.outputs.apple == 'true'
      run: dotnet build samples/Plugin.Maui.PDFViewer.Sample.slnx -c Release
