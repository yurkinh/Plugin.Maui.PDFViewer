name: Build Sample App for CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-sample-ci:
    strategy:
      fail-fast: false
      matrix:
        # Windows builds the Android and Windows heads; xcode-27 (macOS 27 with Xcode 27.2) all but Windows.
        os: [windows-latest, xcode-27]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    # .NET 11's iOS and Mac Catalyst packs (MAUI 11.0.0) need Xcode 27.2. The xcode-27 runner image has it, but its
    # default is 27.1: select 27.2 (or newer) explicitly, and fail rather than build with an older Xcode.
    - name: Select Xcode 27.2
      if: runner.os == 'macOS'
      shell: bash
      run: |
        xcode=$(ls -d /Applications/Xcode_27.2.app 2>/dev/null || ls -d /Applications/Xcode_*.app | sort -V | tail -1)
        sudo xcode-select -s "$xcode"
        version=$(xcodebuild -version | awk 'NR==1 {print $2}')
        echo "Using $xcode: Xcode $version"
        if [ "$(printf '%s\n' 27.2 "$version" | sort -V | head -1)" != "27.2" ]; then
          echo "::error::MAUI 11.0.0 needs Xcode 27.2; this runner has Xcode $version at most."
          exit 1
        fi

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui

    - name: Build Melville.StreamInterfaces into the fork's local feed
      shell: bash
      run: ./external/Pdf/build-local-packages.sh

    - name: Build
      run: dotnet build samples/Plugin.Maui.PDFViewer.Sample.slnx -c Release
