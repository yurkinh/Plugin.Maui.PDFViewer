name: Build Sample App for CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-sample-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]   # Windows heads on Windows; iOS and Mac Catalyst heads on macOS
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui

    - name: Build Melville.StreamInterfaces into the fork's local feed
      shell: bash
      run: ./external/Pdf/build-local-packages.sh

    - name: Build
      run: dotnet build samples/Plugin.Maui.PDFViewer.Sample.slnx -c Release
